version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot updates them while
  # keeping the pin, so pinning does not mean going stale.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"

  # No other manifest: the controllers use only the Python standard library and
  # Webots' own modules, so there are no pip or npm dependencies to update.
